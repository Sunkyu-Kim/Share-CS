<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>농약 농도에 따른 꿀벌 군집 붕괴(CCD) 시뮬레이터</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1F2A44; --sub: #6B6455;
    --yellow: #FFC93C; --yellow-deep: #E8AE13;
    --green: #2D8653;  --green-bg: #E6F4EC;
    --orange: #C96A00; --orange-bg: #FFF0DC;
    --red: #C0392B;    --red-bg: #FDECEA;
    --dockh: 150px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Segoe UI", sans-serif;
    color: var(--navy);
    height: 100dvh;
    overflow: hidden;            /* 스크롤 없음: 모든 기능이 한 화면 */
    position: relative;
    background: #BEE3F5;
  }

  /* ── 전체 화면 동화 장면 ── */
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 위쪽 떠 있는 표시들 ── */
  .chip {
    position: absolute; top: 10px; z-index: 5;
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.9);
    border: 1.5px solid var(--navy); border-radius: 999px;
    padding: 5px 11px; font-size: 0.76rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chip.left { left: 10px; } .chip.right { right: 10px; }
  .badge-wrap { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 5; text-align: center; }
  @media (min-width: 560px) { .badge-wrap { top: 10px; } }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 999px;
    font-size: 0.84rem; font-weight: 800;
    border: 1.5px solid rgba(0,0,0,0.08);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.stable   { color: var(--green);  background: var(--green-bg); }
  .badge.warning  { color: var(--orange); background: var(--orange-bg); }
  .badge.collapse { color: var(--red);    background: var(--red-bg); }
  .badge-desc {
    display: block; margin-top: 4px; font-size: 0.68rem; font-weight: 700;
    color: var(--navy); background: rgba(255,255,255,0.75);
    border-radius: 8px; padding: 2px 8px;
  }

  /* ── 왼쪽 아래 미니 패널 (그래프/정보) ── */
  .panel {
    position: absolute; left: 10px; bottom: calc(var(--dockh) + 12px); z-index: 6;
    width: min(58vw, 270px);
    background: rgba(255,255,255,0.95);
    border: 1.5px solid var(--navy); border-radius: 12px;
    box-shadow: 0 3px 12px rgba(30,20,0,0.18);
    overflow: hidden;
  }
  .panel-tabs { display: flex; align-items: center; border-bottom: 1px solid #EADFC8; }
  .tab {
    flex: 1; padding: 6px 0; font-size: 0.7rem; font-weight: 800; font-family: inherit;
    background: #FFF6D9; color: var(--sub); border: none; cursor: pointer;
  }
  .tab.active { background: #fff; color: var(--navy); }
  .tab-x { width: 34px; background: #FFF6D9; border: none; font-weight: 800; cursor: pointer; color: var(--sub); padding: 6px 0; }
  #graph { display: block; width: 100%; height: 118px; }
  .tab-info { padding: 9px 11px; }
  .tab-info .eq { font-size: 0.76rem; font-weight: 800; }
  .tab-info .legend { margin-top: 4px; font-size: 0.62rem; color: var(--sub); line-height: 1.55; }
  .pstat { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.68rem; color: var(--sub); font-weight: 700; }
  .pstat b { color: var(--navy); font-variant-numeric: tabular-nums; }
  .panel-open {
    position: absolute; left: 10px; bottom: calc(var(--dockh) + 12px); z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.95); border: 1.5px solid var(--navy);
    font-size: 1.05rem; cursor: pointer; box-shadow: 0 3px 12px rgba(30,20,0,0.18);
  }

  /* ── 하단 고정 조작부(독): 보면서 바로 조작 ── */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
    background: rgba(255,255,255,0.94);
    border-top: 2.5px solid var(--navy);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 8px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .dock-inner { max-width: 720px; margin: 0 auto; }
  .dock-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .dock-title {
    font-size: 0.72rem; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock-note { font-size: 0.62rem; color: var(--sub); white-space: nowrap; }
  @media (max-width: 430px) { .dock-note { display: none; } }
  @media (max-width: 360px) { .s-label { display: none; } }
  /* 짧은 화면(폰 가로모드): 조작부를 납작하게 만들어 하늘을 넓게 확보 */
  @media (max-height: 520px) {
    .dock { padding: 5px 10px calc(6px + env(safe-area-inset-bottom)); }
    .dock-top { margin-bottom: 4px; }
    .dock-title { font-size: 0.66rem; }
    .pesticide-btn { padding: 4px 2px; font-size: 0.63rem; }
    .pesticide-btn small { display: none; }
    .slider-row { margin-top: 5px; }
    #graph { height: 88px; }
    .panel { width: min(46vw, 230px); }
  }

  .pesticide-row { display: flex; gap: 6px; }
  .pesticide-btn {
    flex: 1 1 0; min-width: 0; padding: 5px 2px;
    font-size: 0.68rem; font-weight: 800; font-family: inherit;
    color: var(--navy); background: #FFF6D9;
    border: 1.5px solid #EADFC8; border-radius: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pesticide-btn small { display: block; font-weight: 600; font-size: 0.56rem; color: var(--sub); margin-top: 1px; }
  .pesticide-btn.active { background: var(--navy); color: var(--yellow); border-color: var(--navy); }
  .pesticide-btn.active small { color: #E6DFC9; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .s-label { font-size: 0.72rem; font-weight: 800; white-space: nowrap; }
  .s-value { font-size: 0.95rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 64px; text-align: right; }
  .s-value small { font-size: 0.66rem; color: var(--sub); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1;
    height: 9px; border-radius: 6px;
    background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 55%, var(--red) 100%);
    outline: none; cursor: pointer;
  }
  input[type="range"]:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--navy); border: 4px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.35);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--navy); border: 4px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>

<canvas id="scene" aria-label="꿀벌 마을 애니메이션"></canvas>

<div class="chip left">🐝 <span class="num" id="aliveChip">—</span></div>
<div class="chip right">🍂 <span class="num" id="deadChip">—</span></div>

<div class="badge-wrap">
  <span class="badge stable" id="badge"><span class="dot"></span><span id="badgeText">안정</span></span>
  <span class="badge-desc" id="statusDesc"></span>
</div>

<!-- 미니 패널: 그래프 / 정보 -->
<div class="panel" id="panel">
  <div class="panel-tabs">
    <button type="button" class="tab active" id="tabGraphBtn">그래프</button>
    <button type="button" class="tab" id="tabInfoBtn">정보</button>
    <button type="button" class="tab-x" id="panelClose" title="접기">—</button>
  </div>
  <div id="tabGraph"><canvas id="graph" aria-label="1년 동안 벌의 수 변화 그래프"></canvas></div>
  <div id="tabInfo" class="tab-info" style="display:none">
    <div class="eq">dN/dt = rN(1 − N/K) − αCN</div>
    <div class="legend">N 벌의 수 · r 늘어나는 속도 · K 최대로 살 수 있는 수(5만)<br>α 농약의 독한 정도 · C 농약 농도</div>
    <div class="pstat"><span>1년 뒤 살아있는 벌</span><b id="finalN">—</b></div>
    <div class="pstat"><span>붕괴가 시작되는 농도 C*</span><b id="cStar">—</b></div>
  </div>
</div>
<button type="button" class="panel-open" id="panelOpen" style="display:none" title="그래프 열기">📊</button>

<!-- 하단 조작부 -->
<div class="dock" id="dock">
  <div class="dock-inner">
    <div class="dock-top">
      <span class="dock-title">🐝 농약 농도에 따른 꿀벌 군집 붕괴(CCD) 시뮬레이터</span>
      <span class="dock-note">벌 1마리 = 실제 1,000마리 · α는 가정값</span>
    </div>
    <div class="pesticide-row" id="pesticideRow"></div>
    <div class="slider-row">
      <span class="s-label">농약 농도</span>
      <input type="range" id="cSlider" min="0" max="20" step="0.5" value="5" aria-label="농약 농도 (ppb)">
      <span class="s-value"><span id="cValue">5.0</span> <small>ppb</small></span>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   모델 값 모음 (여기만 바꾸면 전체에 반영됨)
   ═══════════════════════════════════════════════ */
var PARAMS = {
  r: 0.05,      // 벌이 늘어나는 속도 (1/일)
  K: 50000,     // 최대로 살 수 있는 벌의 수 (마리)
  N0: 20000,    // 처음 벌의 수 (마리)
  days: 365     // 계산 기간 (일)
};
// 농약 종류별 '독한 정도' α — ※ 가정한 값
var PESTICIDES = [
  { name: "이미다클로프리드", alpha: 0.0050 },
  { name: "설폭사플로르",     alpha: 0.0055 },
  { name: "플루피라디퓨론",   alpha: 0.0060 }
];
var BEE_MAX = 50;   // 화면 속 벌 수 (1마리 = 실제 1,000마리)
var state = { C: 5.0, pIndex: 0 };
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ── 수학 계산: 하루씩(Δt=1일) 365일 ── */
function simulate(C, alpha) {
  var series = new Array(PARAMS.days + 1);
  series[0] = PARAMS.N0;
  for (var t = 0; t < PARAMS.days; t++) {
    var n = series[t];
    var dN = PARAMS.r * n * (1 - n / PARAMS.K) - alpha * C * n; // 모델 식
    series[t + 1] = Math.max(0, n + dN); // 벌의 수는 0보다 작아질 수 없음
  }
  return series;
}
function getStatus(C, alpha) {
  var cStar = PARAMS.r / alpha; // 붕괴가 시작되는 농도
  if (C < 0.7 * cStar) return { key: "stable", label: "안정", color: "#2D8653", desc: "벌들이 건강하게 잘 살고 있어요." };
  if (C < cStar) return { key: "warning", label: "위험", color: "#C96A00", desc: "벌의 수가 눈에 띄게 줄어들어요." };
  return { key: "collapse", label: "붕괴", color: "#C0392B", desc: "벌집이 무너지고 있어요 — 시간이 갈수록 0마리가 돼요." };
}

/* ── 전체 화면 장면 준비 ── */
var scene = document.getElementById("scene");
var sctx = scene.getContext("2d");
var dock = document.getElementById("dock");
var SW = 0, SH = 0, GROUND = 0;
// 배경은 매 프레임 다시 그리면 느려서, 안 보이는 캔버스에 한 번만 그려두고 재사용
var bgCanvas = document.createElement("canvas");
var bgctx = bgCanvas.getContext("2d");
var SCALE = 1;   // 화면이 짧으면 나무·벌집을 작게
var bees = [], clouds = [], fogs = [];
var hive = { x: 0, y: 0 };
var targetAlive = BEE_MAX;
var frame = 0;
var lastAliveShown = -1, lastDeadShown = -1;

function resizeScene() {
  var dpr = window.devicePixelRatio || 1;
  SW = window.innerWidth; SH = window.innerHeight;
  scene.width = SW * dpr; scene.height = SH * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 하단 조작부 높이만큼 땅을 위로 올려서, 죽은 벌도 가려지지 않게
  var dockH = dock.offsetHeight || 150;
  document.documentElement.style.setProperty("--dockh", dockH + "px");
  GROUND = SH - dockH - 22;

  // 화면이 짧으면(폰 가로모드 등) 나무·벌집을 줄여 벌이 날 공간을 확보
  SCALE = Math.min(1, Math.max(0.45, GROUND / 520));
  hive.x = SW * 0.82;
  hive.y = GROUND - 86 * SCALE;

  // 구름도 화면 높이에 맞춰 다시 배치 (가로↔세로 전환 시 어긋나던 문제)
  clouds.forEach(function (c, i) {
    c.y = Math.max(46, GROUND * 0.12) + i * 34 * SCALE;
    if (c.x > SW + 70) c.x = Math.random() * SW;
  });

  bees.forEach(function (b) {
    b.x = Math.min(Math.max(b.x, 20), SW - 20);
    if (b.state === "dead") b.y = groundY(b.seed);
    else b.y = Math.min(Math.max(b.y, skyTop()), GROUND - 60 * SCALE);
  });

  drawBackgroundToCache();
}

// 벌이 날 수 있는 하늘의 위쪽 한계 (상단 표시들과 안 겹치게)
function skyTop() { return GROUND < 300 ? 46 : 74; }
function groundY(seed) { return GROUND - 4 + seed * 16; }

function makeBee(i) {
  return {
    x: Math.random() * 0.8 * (SW || 600) + 40,
    y: 90 + Math.random() * 200,   // 처음 위치(리사이즈 때 안쪽으로 보정됨)
    angle: Math.random() * Math.PI * 2,   // 나는 방향
    turn: 0,
    speed: 0.5 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,   // 날갯짓 박자
    seed: Math.random(),
    state: "alive",                        // alive | falling | dead
    rot: 0, vy: 0
  };
}

/* 벌 비행: 방향을 조금씩 바꾸며 부드럽게 날아다님 */
function updateBees() {
  bees.forEach(function (b) {
    if (b.state === "alive") {
      if (REDUCED) return; // 움직임 줄이기 설정이면 제자리 비행
      if (Math.random() < 0.03) b.turn = (Math.random() - 0.5) * 0.10;
      b.angle += b.turn;
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed * 0.6 + Math.sin(frame * 0.05 + b.phase) * 0.3;

      // 경계 충돌 처리: 가장자리에 닿으려 하면 가운데 쪽으로 방향을 되돌림
      var m = 26, top = skyTop(), bottom = GROUND - 60 * SCALE;
      if (b.x < m || b.x > SW - m || b.y < top || b.y > bottom) {
        var want = Math.atan2((top + bottom) / 2 - b.y, SW * 0.5 - b.x);
        var diff = Math.atan2(Math.sin(want - b.angle), Math.cos(want - b.angle));
        b.angle += diff * 0.08;
        b.x = Math.min(Math.max(b.x, 6), SW - 6);
        b.y = Math.min(Math.max(b.y, top - 2), bottom + 4);
      }
    } else if (b.state === "falling") {
      // 죽어가는 벌: 날갯짓을 멈추고 빙글빙글 돌며 떨어짐
      if (REDUCED) { b.state = "dead"; b.y = groundY(b.seed); b.rot = 2.8; return; }
      b.vy += 0.28;              // 중력
      b.y += b.vy;
      b.x += Math.sin(frame * 0.1 + b.phase) * 0.8;
      b.rot += 0.22;
      if (b.y >= groundY(b.seed)) { b.y = groundY(b.seed); b.state = "dead"; }
    }
  });
}

/* 계산 결과에 맞춰 벌을 천천히 죽이거나 벌집에서 다시 태어나게 함 */
function reconcile() {
  var alive = bees.filter(function (b) { return b.state === "alive"; });
  if (alive.length > targetAlive) {
    var victim = alive[Math.floor(Math.random() * alive.length)];
    victim.state = "falling"; victim.vy = 0;
  } else if (alive.length < targetAlive) {
    var gone = bees.filter(function (b) { return b.state !== "alive"; });
    if (gone.length) {
      var reborn = gone[Math.floor(Math.random() * gone.length)];
      reborn.state = "alive";
      reborn.x = hive.x; reborn.y = hive.y + 10;
      reborn.angle = -Math.PI * (0.3 + Math.random() * 0.4);
      reborn.vy = 0; reborn.rot = 0;
    }
  }
}

/* ── 배경: 하늘·해·언덕·나무·벌집 (안 보이는 캔버스에 한 번만 그려 재사용) ── */
function drawBackgroundToCache() {
  var dpr = window.devicePixelRatio || 1;
  bgCanvas.width = SW * dpr; bgCanvas.height = SH * dpr;
  bgctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var sctx = bgctx;               // 아래 그리기 코드를 그대로 캐시 캔버스에 사용
  var sky = sctx.createLinearGradient(0, 0, 0, SH);
  sky.addColorStop(0, "#A9DBF2");
  sky.addColorStop(0.72, "#E5F6FF");
  sky.addColorStop(1, "#F4FBEF");
  sctx.fillStyle = sky;
  sctx.fillRect(0, 0, SW, SH);

  var sun = sctx.createRadialGradient(SW * 0.12, 96, 4, SW * 0.12, 96, 150);
  sun.addColorStop(0, "rgba(255,236,150,0.95)");
  sun.addColorStop(0.35, "rgba(255,220,110,0.55)");
  sun.addColorStop(1, "rgba(255,220,110,0)");
  sctx.fillStyle = sun;
  sctx.fillRect(0, 0, SW * 0.5, 260);
  sctx.fillStyle = "#FFDF6B";
  sctx.beginPath(); sctx.arc(SW * 0.12, 96, 26, 0, Math.PI * 2); sctx.fill();

  // 땅 + 둥근 언덕 (하단 조작부 높이에 맞춰 위치 계산)
  sctx.fillStyle = "#8FBF5F";
  sctx.fillRect(0, GROUND + 20, SW, SH - GROUND - 20);
  sctx.fillStyle = "#A5CF74";
  sctx.beginPath(); sctx.ellipse(SW * 0.24, GROUND + 26, SW * 0.5, 120, 0, Math.PI, 0); sctx.fill();
  sctx.fillStyle = "#8ABB58";
  sctx.beginPath(); sctx.ellipse(SW * 0.82, GROUND + 30, SW * 0.55, 140, 0, Math.PI, 0); sctx.fill();

  // 나무 + 매달린 벌집 (화면이 짧으면 SCALE만큼 작게 그려 하늘을 확보)
  var k = SCALE;
  var tx = SW * 0.88;
  var fr = Math.min(Math.max(SW * 0.085, 32), 56) * k;
  var trunkH = 140 * k;
  sctx.fillStyle = "#8A5A33";
  sctx.fillRect(tx - 7 * k, GROUND - 128 * k, 14 * k, trunkH);
  sctx.fillStyle = "#5E8F3E";
  sctx.beginPath(); sctx.arc(tx, GROUND - 168 * k, fr, 0, Math.PI * 2); sctx.fill();
  sctx.beginPath(); sctx.arc(tx - fr * 0.85, GROUND - 138 * k, fr * 0.78, 0, Math.PI * 2); sctx.fill();
  sctx.beginPath(); sctx.arc(tx + fr * 0.6, GROUND - 132 * k, fr * 0.7, 0, Math.PI * 2); sctx.fill();
  sctx.strokeStyle = "#6B4A26"; sctx.lineWidth = 2;
  sctx.beginPath(); sctx.moveTo(hive.x, GROUND - 134 * k); sctx.lineTo(hive.x, hive.y - 22 * k); sctx.stroke();
  sctx.fillStyle = "#EDB13F";
  sctx.beginPath(); sctx.ellipse(hive.x, hive.y - 14 * k, 15 * k, 8 * k, 0, 0, Math.PI * 2); sctx.fill();
  sctx.beginPath(); sctx.ellipse(hive.x, hive.y - 4 * k, 19 * k, 10 * k, 0, 0, Math.PI * 2); sctx.fill();
  sctx.beginPath(); sctx.ellipse(hive.x, hive.y + 7 * k, 16 * k, 9 * k, 0, 0, Math.PI * 2); sctx.fill();
  sctx.strokeStyle = "#C98F22"; sctx.lineWidth = 1.5;
  sctx.beginPath(); sctx.ellipse(hive.x, hive.y - 4 * k, 19 * k, 10 * k, 0, 0, Math.PI); sctx.stroke();
  sctx.fillStyle = "#5A3B12";
  sctx.beginPath(); sctx.arc(hive.x, hive.y + 9 * k, 4.5 * k, 0, Math.PI * 2); sctx.fill();
}

/* ── 구름만 매 프레임 그리기 (천천히 흘러감) ── */
function drawClouds() {
  sctx.fillStyle = "rgba(255,255,255,0.92)";
  clouds.forEach(function (c) {
    if (!REDUCED) { c.x += c.speed; if (c.x > SW + 70) c.x = -70; }
    var r = c.scale * SCALE;
    sctx.beginPath();
    sctx.arc(c.x, c.y, 16 * r, 0, Math.PI * 2);
    sctx.arc(c.x + 18 * r, c.y - 7 * r, 13 * r, 0, Math.PI * 2);
    sctx.arc(c.x + 36 * r, c.y, 15 * r, 0, Math.PI * 2);
    sctx.fill();
  });
}

/* ── 벌 한 마리 그리기 ── */
function drawBee(b) {
  var g = sctx;
  var s = Math.min(Math.max(SW / 620, 0.8), 1.25);
  g.save();
  g.translate(b.x, b.y);
  g.scale(s, s);

  var alive = b.state === "alive";
  if (alive) {
    var dir = Math.cos(b.angle) >= 0 ? 1 : -1;   // 가는 방향으로 몸 돌리기
    g.scale(dir, 1);
    g.rotate(Math.sin(frame * 0.04 + b.phase) * 0.12);
  } else {
    g.rotate(b.rot);                              // 떨어질 땐 빙글빙글
  }

  var body   = alive ? "#FFC93C" : "#B9BDC4";     // 죽은 벌은 흑백 느낌
  var stripe = alive ? "#26262A" : "#7B8087";
  var wing   = alive ? "rgba(255,255,255,0.85)" : "rgba(230,230,235,0.5)";
  var flap   = alive && !REDUCED ? Math.abs(Math.sin(frame * 0.45 + b.phase)) : 0.25;

  g.fillStyle = wing;
  g.beginPath(); g.ellipse(-2, -8, 4, 2.5 + 4.5 * flap, -0.35, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(3, -8, 4, 2.5 + 4.5 * flap, 0.35, 0, Math.PI * 2); g.fill();

  g.fillStyle = body;
  g.beginPath(); g.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI * 2); g.fill();
  g.save();
  g.beginPath(); g.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI * 2); g.clip();
  g.strokeStyle = stripe; g.lineWidth = 3; g.lineCap = "round";
  g.beginPath(); g.moveTo(-2, -7); g.lineTo(-2, 7); g.stroke();
  g.beginPath(); g.moveTo(3.5, -7); g.lineTo(3.5, 7); g.stroke();
  g.restore();

  g.fillStyle = stripe;
  g.beginPath(); g.arc(10.5, 0, 4, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#FFFFFF";
  g.beginPath(); g.arc(11.8, -1.2, 1.1, 0, Math.PI * 2); g.fill();
  g.fillStyle = stripe;
  g.beginPath(); g.moveTo(-10, -1.6); g.lineTo(-14, 0); g.lineTo(-10, 1.6); g.closePath(); g.fill();

  g.restore();
}

/* ── 초록 독가스 안개 (농도가 진할수록 짙어짐) ── */
function drawFog(t) {
  var f = state.C / 20;
  if (f <= 0.01) return;
  fogs.forEach(function (o) {
    var x = (o.x + (REDUCED ? 0 : t * o.speed)) % (SW + 300) - 150;
    var grad = sctx.createRadialGradient(x, o.y * GROUND, 10, x, o.y * GROUND, SW * 0.34);
    grad.addColorStop(0, "rgba(124,168,72," + (0.30 * f) + ")");
    grad.addColorStop(1, "rgba(124,168,72,0)");
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, SW, SH);
  });
  var lay = sctx.createLinearGradient(0, GROUND + 30, 0, GROUND - 260 * SCALE);
  lay.addColorStop(0, "rgba(110,150,60," + (0.42 * f) + ")");
  lay.addColorStop(1, "rgba(110,150,60,0)");
  sctx.fillStyle = lay;
  sctx.fillRect(0, 0, SW, SH);
}

function drawScene(t) {
  sctx.clearRect(0, 0, SW, SH);
  sctx.drawImage(bgCanvas, 0, 0, SW, SH);   // 미리 그려둔 배경 붙이기
  drawClouds();
  bees.forEach(function (b) { if (b.state === "dead") drawBee(b); });
  bees.forEach(function (b) { if (b.state === "falling") drawBee(b); });
  bees.forEach(function (b) { if (b.state === "alive") drawBee(b); });
  drawFog(t);
}

/* ── 실시간 숫자 칩 ── */
function updateChips() {
  var alive = 0;
  bees.forEach(function (b) { if (b.state === "alive") alive++; });
  var dead = BEE_MAX - alive;
  if (alive !== lastAliveShown) {
    document.getElementById("aliveChip").textContent = (alive * 1000).toLocaleString("ko-KR");
    lastAliveShown = alive;
  }
  if (dead !== lastDeadShown) {
    document.getElementById("deadChip").textContent = (dead * 1000).toLocaleString("ko-KR");
    lastDeadShown = dead;
  }
}

function tick(t) {
  frame++;
  if (frame % 5 === 0) reconcile();   // 5프레임마다 한 마리씩 바뀌어 자연스럽게
  updateBees();
  drawScene(t * 0.06);
  updateChips();
  requestAnimationFrame(tick);
}

/* ── 미니 그래프: 1년 동안 벌의 수 변화 ── */
var graph = document.getElementById("graph");
var gctx = graph.getContext("2d");
var lastSeries = null, lastStatus = null;

function drawGraph() {
  if (!lastSeries || graph.offsetParent === null) return; // 접혀 있으면 건너뜀
  var dpr = window.devicePixelRatio || 1;
  var rect = graph.getBoundingClientRect();
  if (rect.width === 0) return;
  graph.width = rect.width * dpr; graph.height = rect.height * dpr;
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var W = rect.width, H = rect.height;
  var pad = { left: 34, right: 8, top: 12, bottom: 18 };
  var pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;
  var yMax = PARAMS.K * 1.1;
  function xOf(t) { return pad.left + (t / PARAMS.days) * pw; }
  function yOf(n) { return pad.top + (1 - n / yMax) * ph; }

  gctx.clearRect(0, 0, W, H);
  gctx.font = "9px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";

  if (lastStatus.key === "collapse") {           // 붕괴면 배경이 붉게 물듦
    gctx.fillStyle = "rgba(192,57,43,0.08)";
    gctx.fillRect(pad.left, pad.top, pw, ph);
  }

  gctx.textAlign = "right"; gctx.textBaseline = "middle";
  [0, 25000, 50000].forEach(function (n) {
    var y = yOf(n);
    gctx.strokeStyle = "#F0EBDD"; gctx.lineWidth = 1;
    gctx.beginPath(); gctx.moveTo(pad.left, y); gctx.lineTo(W - pad.right, y); gctx.stroke();
    gctx.fillStyle = "#9A927E";
    gctx.fillText(n === 0 ? "0" : (n / 10000) + "만", pad.left - 5, y);
  });
  gctx.textAlign = "center"; gctx.textBaseline = "top";
  [0, 180, 365].forEach(function (t) {
    var x = xOf(t);
    gctx.fillStyle = "#9A927E";
    gctx.fillText(String(t) + (t === 365 ? "일" : ""), x === xOf(0) ? x + 6 : x, H - pad.bottom + 4);
  });

  gctx.strokeStyle = "#CFC7AF"; gctx.lineWidth = 1; gctx.setLineDash([4, 3]);
  gctx.beginPath(); gctx.moveTo(pad.left, yOf(PARAMS.K)); gctx.lineTo(W - pad.right, yOf(PARAMS.K)); gctx.stroke();
  gctx.setLineDash([]);

  gctx.beginPath();
  gctx.moveTo(xOf(0), yOf(lastSeries[0]));
  for (var t2 = 1; t2 <= PARAMS.days; t2++) gctx.lineTo(xOf(t2), yOf(lastSeries[t2]));
  gctx.lineTo(xOf(PARAMS.days), yOf(0)); gctx.lineTo(xOf(0), yOf(0)); gctx.closePath();
  gctx.fillStyle = lastStatus.color + "22"; gctx.fill();

  gctx.beginPath();
  gctx.moveTo(xOf(0), yOf(lastSeries[0]));
  for (var t3 = 1; t3 <= PARAMS.days; t3++) gctx.lineTo(xOf(t3), yOf(lastSeries[t3]));
  gctx.strokeStyle = lastStatus.color; gctx.lineWidth = 2; gctx.lineJoin = "round";
  gctx.stroke();
}

/* ── 화면 갱신 ── */
function render() {
  var p = PESTICIDES[state.pIndex];
  lastSeries = simulate(state.C, p.alpha);
  lastStatus = getStatus(state.C, p.alpha);
  var cStar = PARAMS.r / p.alpha;
  var finalN = Math.round(lastSeries[PARAMS.days]);

  targetAlive = Math.min(BEE_MAX, Math.max(0, Math.round(finalN / 1000)));

  document.getElementById("cValue").textContent = state.C.toFixed(1);
  var badge = document.getElementById("badge");
  badge.className = "badge " + lastStatus.key;
  document.getElementById("badgeText").textContent = lastStatus.label;
  document.getElementById("statusDesc").textContent = lastStatus.desc;
  document.getElementById("finalN").textContent = finalN.toLocaleString("ko-KR") + "마리";
  document.getElementById("cStar").textContent = cStar.toFixed(1) + " ppb";
  drawGraph();
}

/* ── 이벤트 연결 + 시작 ── */
var slider = document.getElementById("cSlider");
slider.addEventListener("input", function () {
  state.C = parseFloat(slider.value);
  render();
});

var row = document.getElementById("pesticideRow");
PESTICIDES.forEach(function (p, i) {
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pesticide-btn" + (i === 0 ? " active" : "");
  btn.innerHTML = p.name + "<small>α " + p.alpha.toFixed(4) + "</small>";
  btn.addEventListener("click", function () {
    state.pIndex = i;
    var all = row.querySelectorAll(".pesticide-btn");
    for (var k = 0; k < all.length; k++) all[k].classList.remove("active");
    btn.classList.add("active");
    render();
  });
  row.appendChild(btn);
});

// 미니 패널: 탭 전환 + 접기/펼치기
var panel = document.getElementById("panel");
var panelOpen = document.getElementById("panelOpen");
var tabGraph = document.getElementById("tabGraph");
var tabInfo = document.getElementById("tabInfo");
var tabGraphBtn = document.getElementById("tabGraphBtn");
var tabInfoBtn = document.getElementById("tabInfoBtn");
tabGraphBtn.addEventListener("click", function () {
  tabGraph.style.display = ""; tabInfo.style.display = "none";
  tabGraphBtn.classList.add("active"); tabInfoBtn.classList.remove("active");
  drawGraph();
});
tabInfoBtn.addEventListener("click", function () {
  tabGraph.style.display = "none"; tabInfo.style.display = "";
  tabInfoBtn.classList.add("active"); tabGraphBtn.classList.remove("active");
});
document.getElementById("panelClose").addEventListener("click", function () {
  panel.style.display = "none"; panelOpen.style.display = "";
});
panelOpen.addEventListener("click", function () {
  panel.style.display = ""; panelOpen.style.display = "none";
  drawGraph();
});

// 모바일에서 주소창이 열리고 닫힐 때마다 resize가 쏟아지므로 잠깐 모아서 한 번만 처리
var resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { resizeScene(); render(); }, 120);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

// 시작 순서: 벌·구름·안개 만들기 → 화면 크기 계산(배경도 여기서 그림) → 첫 계산 → 죽은 벌 바닥에
for (var i = 0; i < BEE_MAX; i++) bees.push(makeBee(i));
for (var c = 0; c < 3; c++) clouds.push({ x: Math.random() * window.innerWidth, y: 60 + c * 36, scale: 0.8 + Math.random() * 0.7, speed: 0.12 + Math.random() * 0.1 });
for (var f = 0; f < 3; f++) fogs.push({ x: Math.random() * window.innerWidth, y: 0.55 + f * 0.14, speed: 0.35 + f * 0.2 });
resizeScene();
render();
bees.forEach(function (b, idx) {
  if (idx >= targetAlive) { b.state = "dead"; b.y = groundY(b.seed); b.rot = 2.6 + b.seed; }
});
requestAnimationFrame(tick);
</script>
</body>
